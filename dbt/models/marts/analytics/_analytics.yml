version: 2

models:
  - name: mart_tenant_kpis_daily
    description: "KPIs quotidiens par tenant — dashboard exécutif"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, jour]

  - name: mart_cohortes_retention
    description: "Rétention M+0 → M+12 par cohorte de mois d'ouverture et par tenant"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, cohort_mois, mois_offset]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_utilisateurs_actifs <= nb_utilisateurs_cohorte"
    columns:
      - name: mois_offset
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
      - name: taux_retention_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_transactions_anomalies
    description: "Z-score du montant de chaque transaction validée vs historique 90 jours du compte"
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: is_anomalie
        data_tests: [not_null]
      - name: severite
        data_tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']
