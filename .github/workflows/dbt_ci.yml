# ============================================================
# dbt Slim CI — FinTrack Perf & Scale
# ============================================================
# - pull_request : ne reconstruit que les modèles modifiés et leur aval
#   (state:modified+), le reste est lu en prod via --defer. Chaque PR a son
#   schéma isolé FINTRACK_DEV.CI_<PR_ID>, supprimé en fin de job.
# - push sur main : publie le manifest de prod (artefact `prod-manifest`)
#   qui sert d'état de référence aux PR suivantes.
#
# Secrets GitHub à configurer (Settings → Secrets and variables → Actions) :
#   SNOWFLAKE_ACCOUNT        ex. xy12345.eu-west-1
#   SNOWFLAKE_CI_USER        utilisateur technique CI (rôle FINTRACK_DEV_ROLE)
#   SNOWFLAKE_CI_PASSWORD
#   SNOWFLAKE_PROD_USER      utilisé uniquement pour rendre le profil prod au
#                            `dbt parse` (aucune connexion n'est ouverte)
# ============================================================

name: dbt CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt_ci.yml"
  push:
    branches: [main]
    paths:
      - "dbt/**"
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/ci_profiles
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  PYTHON_VERSION: "3.11"
  # dbt-core >= 1.10.5 : syntaxe `arguments:` des tests génériques
  DBT_PACKAGES: "dbt-core~=1.10.5 dbt-snowflake~=1.10.0"

jobs:
  # ----------------------------------------------------------
  # PR : Slim CI
  # ----------------------------------------------------------
  slim-ci:
    # pull_request, ou lancement manuel (Actions → Run workflow) pour
    # vérifier la CI sans ouvrir de PR
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # numéro de PR, ou run<id> en lancement manuel → schéma CI_<…> unique
      DBT_CI_PR_ID: ${{ github.event.pull_request.number || format('run{0}', github.run_id) }}
      SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_CI_PASSWORD: ${{ secrets.SNOWFLAKE_CI_PASSWORD }}
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer dbt
        run: pip install ${{ env.DBT_PACKAGES }}

      - name: Profil CI
        run: |
          mkdir -p ci_profiles
          cp profiles.yml.example ci_profiles/profiles.yml

      - name: Récupérer le manifest de prod
        id: prod_state
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: dbt_ci.yml
          branch: main
          name: prod-manifest
          path: prod-artifacts
          if_no_artifact_found: warn

      - name: dbt deps
        run: dbt deps

      # Échoue tôt, avec un message explicite, si un secret manque.
      # N'affiche jamais les valeurs : uniquement « défini / vide » et, pour
      # le compte (non secret), sa forme.
      - name: Vérifier les secrets Snowflake
        run: |
          ok=true
          for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_CI_USER SNOWFLAKE_CI_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error title=Secret manquant::$v est vide ou absent (Settings → Secrets and variables → Actions → Repository secrets)"
              ok=false
            else
              echo "$v : défini (${#v} caractères pour le nom, valeur masquée)"
            fi
          done
          case "$SNOWFLAKE_ACCOUNT" in
            *.snowflakecomputing.com*|http*)
              echo "::error title=Format du compte::SNOWFLAKE_ACCOUNT doit être l'identifiant seul (ex. ORGNAME-ACCOUNTNAME), sans https:// ni .snowflakecomputing.com"
              ok=false ;;
          esac
          case "$SNOWFLAKE_ACCOUNT" in
            *" "*|*$'\n'*)
              echo "::error title=Format du compte::SNOWFLAKE_ACCOUNT contient un espace ou un retour à la ligne"
              ok=false ;;
          esac
          $ok

      - name: dbt debug
        run: |
          # Sortie dans un fichier puis test explicite du code retour : la
          # cause est remontée en annotation, lisible sans ouvrir les logs.
          rc=0
          dbt debug --target ci > dbt_debug.log 2>&1 || rc=$?
          cat dbt_debug.log
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -iE "error|fail|denied|incorrect|mfa|multi-factor|not allowed|25000|390" dbt_debug.log \
                  | head -6 | tr '\n' ' ' | tr -s ' ' | cut -c1-1500 || true)
            echo "::error title=dbt debug (code $rc)::${msg:-aucun message reconnu, voir le log de cette etape}"
            exit "$rc"
          fi

      # L'artefact est téléchargé dans <repo>/prod-artifacts (= ../prod-artifacts
      # depuis dbt/ : `path` est relatif au workspace, pas au working-directory)
      - name: Vérifier l'état de prod
        run: |
          if [ -f ../prod-artifacts/manifest.json ]; then
            echo "has_state=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de manifest de prod : build complet (premier run)."
            echo "has_state=false" >> "$GITHUB_ENV"
          fi

      # Les tests unitaires ont besoin que les relations des modèles testés
      # existent : on les crée vides (--empty), puis on construit en
      # --full-refresh (sinon les incrémentaux, créés vides, ne chargeraient
      # rien). `build` et non `run` pour l'étape --empty : il inclut le
      # snapshot, dont dépend dim_comptes_scd2. Les sources lourdes sont
      # limitées au dernier mois en CI (cf. stg_transactions, var ci_lookback_days).
      - name: dbt build (Slim CI)
        run: |
          if [ "$has_state" = "true" ]; then
            SELECTION=(--select "state:modified+" --defer --state ../prod-artifacts)
          else
            SELECTION=()
          fi
          # Elementary n'enregistre pas les résultats de CI : ce n'est pas
          # l'historique de prod, et quand aucun modèle n'est modifié, le
          # schéma CI n'existe pas → son hook on-run-end échouait (PR #8).
          CI_VARS='{tests_complets: true, disable_run_results: true, disable_tests_results: true, disable_dbt_artifacts_autoupload: true, disable_dbt_invocation_autoupload: true, disable_dbt_columns_autoupload: true}'
          # Lance une commande dbt ; en cas d'échec, remonte la cause en
          # annotation (lisible sur la PR sans ouvrir les logs).
          run_dbt() {
            local rc=0
            "$@" > dbt_step.log 2>&1 || rc=$?
            cat dbt_step.log
            if [ "$rc" -ne 0 ]; then
              local msg
              msg=$(grep -E "ERROR|FAIL |Error|error:|does not exist|not authorized" dbt_step.log \
                    | head -8 | tr '\n' ' ' | tr -s ' ' | cut -c1-1500 || true)
              echo "::error title=dbt build (code $rc)::${msg:-aucun message reconnu, voir le log de cette etape}"
              exit "$rc"
            fi
          }
          run_dbt dbt build --target ci --empty        "${SELECTION[@]}" --exclude tag:experimental \
            --exclude-resource-type test --exclude-resource-type unit_test --vars "$CI_VARS"
          run_dbt dbt build --target ci --full-refresh "${SELECTION[@]}" --exclude tag:experimental \
            --vars "$CI_VARS"

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts-${{ github.event.pull_request.number || github.run_id }}
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          retention-days: 7

      - name: Cleanup du schéma CI
        if: always()
        run: dbt run-operation drop_ci_schema --target ci

  # ----------------------------------------------------------
  # main : publication de l'état de prod
  # ----------------------------------------------------------
  publish-prod-manifest:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNOWFLAKE_PROD_USER: ${{ secrets.SNOWFLAKE_PROD_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/unused.p8
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer dbt
        run: pip install ${{ env.DBT_PACKAGES }}

      - name: Profil
        run: |
          mkdir -p ci_profiles
          cp profiles.yml.example ci_profiles/profiles.yml

      - name: dbt deps + parse (target prod)
        run: |
          dbt deps
          dbt parse --target prod

      - uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: dbt/target/manifest.json
          retention-days: 90
